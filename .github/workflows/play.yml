name: Play

# Every app change merged to main goes to Play internal testing.
# Secrets (Settings › Secrets and variables › Actions):
#   PLAY_SERVICE_ACCOUNT_JSON       key of a Play-only service account (no access to the sheet)
#   ANDROID_UPLOAD_KEYSTORE_BASE64  upload.jks in base64
#   ANDROID_UPLOAD_PASSWORD         contents of upload.password
# Play re-signs the app with its own key, so the upload key only proves who sent the bundle.
on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/neko/src/shared/**"
  workflow_dispatch:

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Sign and build the bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          # Above any bundle uploaded by hand; Play rejects a versionCode it has seen.
          export NEKO_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nkeyAlias=upload\npassword=%s\n' "$RUNNER_TEMP/upload.jks" "$PASSWORD" > signing.properties
          ./gradlew bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks" signing.properties
      - name: Release notes from the merged change
        # The squash subject is a pt-BR sentence saying what changed: testers read it under
        # "O que há de novo". Play allows 500 characters.
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          git log -1 --format=%s | sed -E 's/ \(#[0-9]+\)$//' | cut -c1-480 > "$RUNNER_TEMP/whatsnew/whatsnew-pt-BR"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-pt-BR"
      - id: upload
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.johnlaff.neko
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
      # Notes are a nicety: if Play refuses them, the build still ships without them.
      - if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.johnlaff.neko
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
